<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' https://storage.googleapis.com https://placehold.co data:; script-src 'self' https://cdn.tailwindcss.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self';" />
  <title>Sign In - MRB Law Firm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/10 backdrop-blur rounded-xl p-8 border border-gray-800">
    <h1 class="text-2xl font-bold mb-6 text-center">Sign in</h1>
    <form class="space-y-4" action="#" method="post">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input id="email" name="email" type="email" required
               class="w-full px-4 py-2 rounded-md bg-black/60 border border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 outline-none" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Password</label>
        <input id="password" name="password" type="password" required
               class="w-full px-4 py-2 rounded-md bg-black/60 border border-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500 outline-none" />
      </div>
      <button type="submit"
              class="w-full mt-2 px-4 py-2 rounded-md font-semibold text-white bg-gradient-to-r from-indigo-600 to-blue-500 hover:brightness-110 active:scale-[.99]">
        Continue
      </button>
      <p class="text-center text-sm text-gray-400 mt-4">
        Back to <a href="./index.html" class="text-indigo-400 hover:underline">Home</a>
      </p>
    </form>
  </div>
</body>
</html>
